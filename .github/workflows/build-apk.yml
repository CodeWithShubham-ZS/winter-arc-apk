name: Build Winter Arc APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor project
        run: |
          mkdir capacitor-app && cd capacitor-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Winter Arc" "com.shubham.winterarc" --web-dir=www
          mkdir -p www
          unzip -o ../winter-arc-dist.zip -d www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd capacitor-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-apk
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
